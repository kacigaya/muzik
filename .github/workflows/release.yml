name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      CERT_SHA256: 4583a987938443a2c93bbcd93dfbc766464d380c4de068fcb1ae68d6212018f9
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against the app version
        run: |
          version="${TAG#v}"
          grep -q "versionName = \"$version\"" app/build.gradle.kts || { echo "versionName is not $version"; exit 1; }
          awk -v v="## $version" '$0 == v {f = 1; next} /^## / {if (f) exit} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0"'

      - name: Test and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Build the signed release APK
        run: |
          keystore="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          MUZIK_KEYSTORE="$keystore" ./gradlew --no-daemon :app:assembleRelease
          rm -f "$keystore"
        env:
          KEYSTORE_BASE64: ${{ secrets.MUZIK_KEYSTORE_BASE64 }}
          MUZIK_KEYSTORE_PASSWORD: ${{ secrets.MUZIK_KEYSTORE_PASSWORD }}
          MUZIK_KEY_ALIAS: ${{ secrets.MUZIK_KEY_ALIAS }}
          MUZIK_KEY_PASSWORD: ${{ secrets.MUZIK_KEY_PASSWORD }}

      - name: Check the signature and name the asset
        run: |
          version="${TAG#v}"
          apk=app/build/outputs/apk/release/app-release.apk
          digest="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          [ "$digest" = "$CERT_SHA256" ] || { echo "$apk is not signed with the release key"; exit 1; }
          mkdir -p "$RUNNER_TEMP/assets"
          cp "$apk" "$RUNNER_TEMP/assets/muzik-$version.apk"
          cd "$RUNNER_TEMP/assets"
          sha256sum -- *.apk > SHA256SUMS.txt

      - name: Publish the release
        run: |
          prerelease=()
          case "$TAG" in v0.*|*-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" "$RUNNER_TEMP"/assets/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Muzik $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
