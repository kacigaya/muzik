name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # npm test expects the Python bridge in .venv, matching local development.
      - name: Install the Python bridge
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements.txt

      # Ubuntu 26.04 runner images no longer ship ffmpeg; the artwork tests call it directly.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Report advisories below high without blocking unrelated changes.
      - name: Audit dependencies
        run: node scripts/audit_dependencies.mjs

  image:
    name: Docker image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # Verify the Docker install of ffmpeg, Python, and yt-dlp separately from the host setup.
      - run: docker build -t muzik:ci .
